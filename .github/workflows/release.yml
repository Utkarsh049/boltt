name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            pkg-config

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Boltt v__VERSION__'
          releaseBody: |
            ### Downloads

            | Operating System | Recommended Installer | Alternative Package |
            | :--- | :--- | :--- |
            | Windows (x64) | [Setup Installer (.exe)](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/boltt___VERSION___x64-setup.exe) | [MSI Package (.msi)](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/boltt___VERSION___x64_en-US.msi) |
            | macOS (Apple Silicon) | [Disk Image (.dmg)](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/boltt___VERSION___aarch64.dmg) | [Application Archive (.tar.gz)](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/boltt_aarch64.app.tar.gz) |
            | Linux (x64) | [AppImage (.AppImage)](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/boltt___VERSION___amd64.AppImage) | [Debian Package (.deb)](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/boltt___VERSION___amd64.deb), [RPM Package (.rpm)](https://github.com/${{ github.repository }}/releases/download/v__VERSION__/boltt-__VERSION__-1.x86_64.rpm) |

            All installation packages, checksums, and source code archives are available in the Assets section below.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
